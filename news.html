<!DOCTYPE html>
<html lang="en" data-year="2025">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sports News | Kick Sports</title>
  <meta name="description" content="Latest sports news and headlines across football, cricket, NBA, NFL, F1 and more." />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="section">
      <div class="container">
        <h1 id="news-title">Sports News</h1>
        <p class="section-sub" id="news-sub">Top stories across football, cricket, NBA, NFL, F1 and more.</p>

        <p class="sub"><span id="news-updated"></span></p>
        <div class="articles" id="articles">
          <p class="muted">Loading headlines…</p>
        </div>

        <p class="source-note">
          Headlines and summaries from <a href="https://www.bbc.co.uk/sport" target="_blank" rel="noopener">BBC Sport</a> and
          <a href="https://www.espn.com" target="_blank" rel="noopener">ESPN</a> RSS feeds. Every story links to the original article.
        </p>

        <!-- Ad: in-content -->
        <div class="ad-slot" aria-hidden="true">
          <ins class="adsbygoogle" style="display:block" data-ad-slot="0000000003" data-ad-format="auto" data-full-width-responsive="true"></ins>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/news.js"></script>
</body>
</html>
